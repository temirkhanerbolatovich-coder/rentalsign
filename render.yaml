# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free web service + external free PostgreSQL (Neon). No paid disk/database.
services:
  - type: web
    name: rentalsign
    runtime: node
    plan: free
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build:cloud && npm prune --omit=dev
    startCommand: npm run start:production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LINK_TTL_HOURS
        value: "72"
      - key: SESSION_HOURS
        value: "12"
